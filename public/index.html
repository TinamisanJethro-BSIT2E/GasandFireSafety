<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Gas & Fire Safety</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body data-page="login">
  <main class="login-screen">
    <section class="login-box">
      <div class="brand"><span class="brand-mark"><svg class="brand-symbol" viewBox="0 0 24 24" aria-hidden="true"><path class="brand-shield" d="M12 2.5 20 5.6v5.5c0 5.2-3.3 9-8 10.8-4.7-1.8-8-5.6-8-10.8V5.6l8-3.1Z"/><path class="brand-flame" d="M12.7 6.4c.5 2.1-1.8 3.1-1.7 5.1-1.1-.6-1.7-1.6-1.7-2.8-1.3 1.2-2.1 2.8-2.1 4.5a4.8 4.8 0 0 0 9.6 0c0-2.7-1.7-4.7-4.1-6.8Z"/></svg></span><span>Gas &amp; Fire Safety</span></div>
      <h1>Welcome back</h1>
      <p class="subtitle">Sign in to monitor your IoT gas and fire safety system.</p>
      <div id="notice" class="notice" role="status"></div>
      <form id="loginForm">
        <div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required maxlength="64"></div>
        <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256"></div>
        <button class="button" type="submit" style="width:100%">Sign in</button>
      </form>
      <p class="footer">Cavite State University – Imus Campus · Hospitality Management</p>
    </section>
  </main>
</body>
</html>
